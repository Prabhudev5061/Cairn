name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libxss1 xdg-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck, lint, test)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Relax AppArmor userns restriction (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: E2E Smoke Test (Windows)
        if: runner.os == 'Windows'
        run: pnpm test:e2e

      - name: E2E Smoke Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
